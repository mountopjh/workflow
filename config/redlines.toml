# V6.0 通用工程红线（语言无关骨架，按项目可调）
# 每条红线一个 [[redline]] 表项。执行者 与 审计员 通过编号引用。

# ─────────────────────────────────────────────────────────────────────────────
[[redline]]
id = "R1"
title = "流式/分批"
rule = "处理大数据集禁一次性全量加载；必须有分批或流式策略。"
applicable_when = "数据量级 > 10⁴ 或 单次加载估算 > 100MB"
exempt_when = "明确知道数据量级 ≤ 10³ 且单次加载 ≤ 10MB"

# ─────────────────────────────────────────────────────────────────────────────
[[redline]]
id = "R2"
title = "资源显式释放"
rule = "文件/连接/大内存对象必须用 try/finally / using / defer 等机制保证释放，禁止依赖 GC。"
applicable_when = "代码中出现文件句柄、网络连接、子进程、数据库连接、大内存数组任一"
exempt_when = "纯计算无外部资源"

# ─────────────────────────────────────────────────────────────────────────────
[[redline]]
id = "R3"
title = "跨边界容错"
rule = "所有 I/O、网络、子进程、跨进程调用必须有错误处理；错误日志必须带上下文（不允许空 catch）。"
applicable_when = "总是适用（除非纯算法）"

# ─────────────────────────────────────────────────────────────────────────────
[[redline]]
id = "R4"
title = "依赖锁版本"
rule = "项目必须有 lockfile（package-lock.json / poetry.lock / Cargo.lock / go.sum 等）；禁全局污染安装。"
applicable_when = "总是适用"

# ─────────────────────────────────────────────────────────────────────────────
[[redline]]
id = "R5"
title = "文件行数上限"
rule = "单文件代码行数不超过下表上限。超过强制拆分。"
[redline.params.max_lines_by_lang]
default = 300
python = 300
typescript = 400
javascript = 400
go = 500
rust = 400
java = 400
csharp = 400

# ─────────────────────────────────────────────────────────────────────────────
[[redline]]
id = "R6"
title = "命名语义化"
rule = "禁止 utils.* / helper.* / tmp.* / common.* / misc.* 等无信息命名。文件名格式建议 [模块]_[动作]_[对象].<ext>。"
applicable_when = "总是适用"

# ─────────────────────────────────────────────────────────────────────────────
[[redline]]
id = "R7"
title = "自动化测试"
rule = "每交付必有可一键运行的测试入口（如 pytest / vitest / go test）；禁用'手测通过'作为交卷理由。"
applicable_when = "总是适用（Hotfix 标签可放宽，但 PASS 后须立刻补单）"

# ─────────────────────────────────────────────────────────────────────────────
[[redline]]
id = "R8"
title = "可观测性"
rule = "关键路径必须有日志埋点；错误日志必须包含上下文信息；禁空 catch / 仅打印 stack 不带业务上下文。"
applicable_when = "总是适用"

# ─────────────────────────────────────────────────────────────────────────────
[[redline]]
id = "R9"
title = "配置双层隔离"
rule = "系统级配置（运行环境、依赖声明）与业务级配置（阈值、关键词）必须物理分文件；业务侧禁反写系统侧。"
applicable_when = "项目存在两类配置时"

# ─────────────────────────────────────────────────────────────────────────────
[[redline]]
id = "R10"
title = "依赖申报"
rule = "新增第三方依赖必须在 CURRENT_TASK.md 用 #NewDep 标签声明；规划师在工单 §3 写明包名/版本/替代品比较后方可使用。"
applicable_when = "工单引入了上一版本未出现的依赖"
